<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Đăng nhập quản trị · Kiến Học</title><link rel="stylesheet" href="/ops/login.css"><script defer src="/ops/login.js"></script></head><body class="login-page"><main class="login-card"><div class="eyebrow">KIẾN HỌC / OPERATIONS</div><h1>Không gian quản trị.</h1><p>Chỉ dành cho tài khoản được cấp quyền. Xác minh bằng mã email cho mỗi phiên quản trị.</p><form id="ops-login"><label for="email">Email quản lý</label><input id="email" type="email" autocomplete="username" required maxlength="254"><div id="code-field" hidden><label for="code">Mã xác minh gồm 6 số</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></div><button class="primary" id="submit" type="submit">Gửi mã xác minh</button><p id="login-status" role="status" aria-live="polite"></p></form><small>Phiên quản trị tự hết hạn sau 30 phút. Không lưu mã hay khóa đăng nhập vào trình duyệt.</small></main></body></html>
